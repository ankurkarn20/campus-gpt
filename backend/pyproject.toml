[project]
name = "campusgpt"
version = "0.1.0"
description = "CampusGPT: AI-powered university helpdesk (backend)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<0.5",
    "pydantic-settings>=2.4,<3",
    "argon2-cffi>=23.1,<26",
    "faker>=30,<40",
    "numpy>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["campusgpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends(...) in parameter defaults.
extend-immutable-calls = ["fastapi.Depends", "campusgpt.auth.require_role"]
